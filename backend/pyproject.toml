[project]
name = "fund-knowledge-platform"
version = "0.1.0"
description = "Fund operations knowledge, document lifecycle and evidence-backed consultation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
  "pymysql>=1.1,<2", "oracledb>=3,<4", "cryptography>=44", "alembic>=1.14,<2",
  "qdrant-client>=1.14,<2", "pypdf>=5,<7", "python-docx>=1.1,<2",
  "pdfplumber>=0.11.9,<1", "pypdfium2>=5.13,<6",
  "openpyxl>=3.1,<4", "bleach>=6,<7", "markdown-it-py>=3,<5",
  "pillow>=11,<13", "jsonschema>=4.23,<5", "authlib>=1.4,<2",
  "celery>=5.4,<6", "boto3>=1.36,<2", "jieba>=0.42,<1", "pyyaml>=6,<7", "reportlab>=4,<5"
]

[project.optional-dependencies]
semantic = ["fastembed>=0.6,<1"]
local-models = ["torch>=2.6,<3", "transformers>=5,<6", "safetensors>=0.5,<1",
                "sentencepiece>=0.2,<1", "huggingface-hub>=1.31,<2"]
test = ["pytest>=8,<9", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fund_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
